<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>رأس المال: إرث الكيميائي</title>
    <meta name="description" content="لعبة واقع افتراضي تعليمية عن الإيرادات والأرباح">
    <link rel="icon" type="image/svg+xml" href="TemplateData/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">
        <div class="card">
          <div class="crest">⚗</div>
          <h1>رأس المال</h1>
          <h2>إرث الكيميائي</h2>
          <div class="bar"><div id="bar-fill"></div></div>
          <p id="loading-text">جارٍ تحميل المتجر… <span id="pct">0%</span></p>
        </div>
      </div>
      <div id="hud">
        <button id="entervr" disabled>ادخل الواقع الافتراضي 🥽</button>
        <p id="vr-help" hidden></p>
        <button id="fullscreen" title="ملء الشاشة">⛶</button>
      </div>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
      };
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#bar-fill");
      var pct = document.querySelector("#pct");
      var unityInstance = null;
      {{{ WEBXR_POLYFILL_CONFIG }}}

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          fill.style.width = (100 * progress) + "%";
          pct.textContent = Math.round(100 * progress) + "%";
        }).then((instance) => {
          unityInstance = instance;
          loading.classList.add("done");
          setTimeout(() => { loading.style.display = "none"; }, 700);
          canvas.focus();
        }).catch((message) => {
          document.querySelector("#loading-text").textContent = "تعذّر تشغيل اللعبة: " + message;
        });
      };
      document.body.appendChild(script);

      var enterVRButton = document.getElementById('entervr');
      document.addEventListener('onVRSupportedCheck', function (event) {
        enterVRButton.disabled = !event.detail.supported;
        enterVRButton.classList.toggle('ready', event.detail.supported);
      }, false);
      var vrHelp = document.getElementById('vr-help');
      function say(msg) { vrHelp.textContent = msg; vrHelp.hidden = false; setTimeout(() => { vrHelp.hidden = true; }, 6000); }
      enterVRButton.addEventListener('click', function () {
        if (!window.isSecureContext || !navigator.xr) { say("افتح الرابط في متصفح النظارة (يحتاج https)."); return; }
        if (!unityInstance || !unityInstance.Module.WebXR) { say("انتظر حتى يكتمل التحميل ثم اضغط مجددًا."); return; }
        var webXR = unityInstance.Module.WebXR;
        // Safety net: the build ships its WebXR settings; if they did not arrive, use the same values here.
        if (!webXR.Settings) {
          webXR.Settings = { VRRequiredReferenceSpace: ["local-floor"], VROptionalFeatures: ["hand-tracking"],
            ARRequiredReferenceSpace: ["local-floor"], AROptionalFeatures: ["hit-test"],
            UseFramebufferScaleFactor: true, UseNativeResolution: false, FramebufferScaleFactor: 0.8 };
        }
        try { webXR.toggleVR(); } catch (e) { console.error(e); say("تعذّر بدء الواقع الافتراضي. أعد تحميل الصفحة وحاول مجددًا."); }
      }, false);
      document.getElementById('fullscreen').addEventListener('click', function () {
        if (unityInstance) unityInstance.SetFullscreen(1);
      }, false);
      // Keep the page from scrolling/zooming while playing on phones.
      document.addEventListener('touchmove', function (e) { if (e.target === canvas) e.preventDefault(); }, { passive: false });
    </script>
  </body>
</html>
