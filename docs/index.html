<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>رأس المال: إرث الكيميائي</title>
    <meta name="description" content="لعبة واقع افتراضي تعليمية عن الإيرادات والأرباح">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">
        <div class="card">
          <div class="crest">⚗</div>
          <h1>رأس المال</h1>
          <h2>إرث الكيميائي</h2>
          <div class="bar"><div id="bar-fill"></div></div>
          <p id="loading-text">جارٍ تحميل المتجر… <span id="pct">0%</span></p>
        </div>
      </div>
      <div id="hud">
        <button id="entervr" disabled>ادخل الواقع الافتراضي 🥽</button>
        <button id="fullscreen" title="ملء الشاشة">⛶</button>
      </div>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Web.loader.js";
      var config = {
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Capital Team",
        productName: "Capital - The Alchemist's Legacy",
        productVersion: "1.0",
      };
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#bar-fill");
      var pct = document.querySelector("#pct");
      var unityInstance = null;
      

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          fill.style.width = (100 * progress) + "%";
          pct.textContent = Math.round(100 * progress) + "%";
        }).then((instance) => {
          unityInstance = instance;
          loading.classList.add("done");
          setTimeout(() => { loading.style.display = "none"; }, 700);
          canvas.focus();
        }).catch((message) => {
          document.querySelector("#loading-text").textContent = "تعذّر تشغيل اللعبة: " + message;
        });
      };
      document.body.appendChild(script);

      var enterVRButton = document.getElementById('entervr');
      document.addEventListener('onVRSupportedCheck', function (event) {
        enterVRButton.disabled = !event.detail.supported;
        enterVRButton.classList.toggle('ready', event.detail.supported);
      }, false);
      enterVRButton.addEventListener('click', function () {
        if (unityInstance) unityInstance.Module.WebXR.toggleVR();
      }, false);
      document.getElementById('fullscreen').addEventListener('click', function () {
        if (unityInstance) unityInstance.SetFullscreen(1);
      }, false);
      // Keep the page from scrolling/zooming while playing on phones.
      document.addEventListener('touchmove', function (e) { if (e.target === canvas) e.preventDefault(); }, { passive: false });
    </script>
  </body>
</html>
